bindings:
- id: REQ-main
  kind: requirement
  title: 每个接收会话自己的主干
  source_id: source-1
  heading: 5.2 每个会话自己的主干图
  status: current
  summary: X → Y 属于 Y，按需创建，不展开所有下游或全历史。
- id: REQ-create
  kind: requirement
  title: 空卡片何时变成真实会话
  source_id: source-1
  heading: 5.3 右键菜单与开始会话
  status: current
  summary: 先选工作区，再明确开始；取消不创建也不发送模型请求。
- id: REQ-disclosure
  kind: requirement
  title: 固定上限与披露位置
  source_id: source-1
  heading: 6.4 图中的固定上限与披露位置日志
  status: current
  summary: 图区分固定授权与已返回内容，日志只保存位置和计数。
- id: REQ-context-ui
  kind: requirement
  title: 上下文状态如何让人看懂
  source_id: source-2
  heading: 7. 用户界面与 Maintenance Adapter
  status: current
  summary: 授权、窗口、保留及生效状态分别呈现，预览不冒充模型已读。
- id: IMP-migration
  kind: implementation
  title: 主干迁移与冲突恢复
  source_id: source-6
  heading: 更新、卸载与数据
  status: current
  summary: 独立架构下的升级顺序、profile 注册与重启要求；旧混合图归属按各自记录核对。
- id: IF-upstream-notice-local
  kind: interface
  title: 上游说明的宿主注册点
  source_id: source-4
  heading: 已知问题
  status: current
  summary: 源码位置与边界文字见本记录；详细交接约定见records/interface/IF-upstream-notice.md。
- id: IMP-selector
  kind: implementation
  title: 原生会话与思维图切换
  source_id: source-4
  heading: 部署方法
  status: current
  summary: 真实会话标题栏切换，iframe 复用，适配宿主主题与侧栏。
- id: MOD-context
  kind: module
  title: 来源上下文面板入口
  source_id: source-5
  heading: 维护入口
  status: current
  summary: SourceContextPanel 与当前会话桥接，共享 DTO 不另造权限合同。
- id: VER-ui
  kind: verification
  title: 原生上下文面板的历史验证
  source_id: source-5
  heading: 验证
  status: current
  summary: 合成浏览器与身份、范围校验；不替代原生 surface 联合验收。
- id: VER-graph
  kind: verification
  title: 主干图开发验证入口
  source_id: source-6
  heading: 从源码开发
  status: current
  summary: 模型、桥接、构建和合成浏览器命令及其范围。
- id: REQ-remove
  kind: requirement
  title: 移除、撤销和刷新
  source_id: source-1
  heading: 5.4 移除、撤销和刷新
  status: current
  summary: 同一领域命令撤销连接；保留历史与真实对象，刷新不能复活已撤销关系。
- id: REQ-storage
  kind: requirement
  title: 图的轻量存储边界
  source_id: source-1
  heading: 5.6 轻量存储边界
  status: current
  summary: 保存结构和必要短摘录；正文回真源读取，图与日志分别更新。
- id: REQ-adapter
  kind: requirement
  title: 图与业务扩展适配同步
  source_id: source-1
  heading: 7.1 Maintenance Adapter 必须同步交付
  status: current
  summary: 图schema、归属和生命周期变化需要配套业务扩展适配；提供方合同留在Maintenance。
